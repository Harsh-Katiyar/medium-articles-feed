name: Update Medium Articles

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-medium:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Medium RSS
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://medium.com/feed/@HarshKatiyar" \
            -o medium.xml

      - name: Generate articles.json
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import json
          import html
          import re

          tree = ET.parse("medium.xml")
          root = tree.getroot()

          articles = []

          # Medium RSS namespaces
          namespaces = {
              "content": "http://purl.org/rss/1.0/modules/content/",
              "dc": "http://purl.org/dc/elements/1.1/"
          }

          for item in root.findall("./channel/item")[:6]:

              title = item.findtext("title", "").strip()
              link = item.findtext("link", "").strip()
              pub_date = item.findtext("pubDate", "").strip()

              # --------------------------------------------------
              # DESCRIPTION
              # --------------------------------------------------

              description = item.findtext("description", "").strip()

              # If normal RSS description is empty,
              # use Medium's full content instead.
              if not description:
                  content = item.findtext(
                      "content:encoded",
                      "",
                      namespaces
                  ).strip()

                  description = content

              # Decode HTML entities
              description = html.unescape(description)

              # Remove script/style blocks
              description = re.sub(
                  r"<(script|style).*?</\1>",
                  "",
                  description,
                  flags=re.I | re.S
              )

              # Remove HTML tags
              description = re.sub(
                  r"<[^>]+>",
                  " ",
                  description
              )

              # Clean whitespace
              description = re.sub(
                  r"\s+",
                  " ",
                  description
              ).strip()

              # --------------------------------------------------
              # TAGS / CATEGORIES
              # --------------------------------------------------

              tags = []

              for category in item.findall("category"):
                  tag = category.text

                  if tag:
                      tag = html.unescape(tag).strip()

                      if tag and tag not in tags:
                          tags.append(tag)

              # Limit tags to maximum 4
              tags = tags[:4]

              # --------------------------------------------------
              # SAVE ARTICLE
              # --------------------------------------------------

              articles.append({
                  "title": title,
                  "url": link,
                  "date": pub_date,
                  "description": description[:240],
                  "tags": tags
              })

          with open("articles.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"articles": articles},
                  f,
                  indent=2,
                  ensure_ascii=False
              )
          PY

      - name: Commit updated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add articles.json

          git diff --cached --quiet || \
            git commit -m "Update Medium articles"

          git push
