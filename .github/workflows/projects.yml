name: Update Portfolio Projects

on:
  schedule:
    - cron: "30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Fetch portfolio repositories
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/Harsh-Katiyar/repos?per_page=100&sort=updated" \
            > repos.json


      - name: Generate projects.json
        run: |

          python3 <<'PY'

          import json


          # -----------------------------------------
          # Load GitHub repositories
          # -----------------------------------------

          with open(
              "repos.json",
              "r",
              encoding="utf-8"
          ) as f:

              repos = json.load(f)


          # -----------------------------------------
          # Load portfolio configuration
          # -----------------------------------------

          with open(
              "portfolio-config.json",
              "r",
              encoding="utf-8"
          ) as f:

              config = json.load(f)


          portfolio_config = config.get(
              "projects",
              {}
          )


          projects = []


          # -----------------------------------------
          # Process repositories
          # -----------------------------------------

          for repo in repos:

              topics = repo.get(
                  "topics",
                  []
              )


              # Only repositories marked
              # with "portfolio" are included.
              if "portfolio" not in topics:
                  continue


              repo_name = repo.get(
                  "name",
                  ""
              )


              custom = portfolio_config.get(
                  repo_name,
                  {}
              )


              # -------------------------------------
              # Custom portfolio information
              # -------------------------------------

              title = custom.get(
                  "title",
                  repo_name
              )


              subtitle = custom.get(
                  "subtitle",
                  ""
              )


              description = custom.get(
                  "description",
                  repo.get("description")
                  or
                  "Security project and hands-on cybersecurity work."
              )


              category = custom.get(
                  "category",
                  "Cybersecurity Project"
              )


              tools = custom.get(
                  "tools",
                  []
              )


              featured = custom.get(
                  "featured",
                  "portfolio-featured" in topics
              )


              order = custom.get(
                  "order",
                  999
              )


              # -------------------------------------
              # Create portfolio project
              # -------------------------------------

              project = {

                  "name": repo_name,

                  "title": title,

                  "subtitle": subtitle,

                  "description": description,

                  "category": category,

                  "tools": tools,

                  "url": repo.get(
                      "html_url",
                      ""
                  ),

                  "language": repo.get(
                      "language",
                      ""
                  ),

                  "topics": topics,

                  "stars": repo.get(
                      "stargazers_count",
                      0
                  ),

                  "forks": repo.get(
                      "forks_count",
                      0
                  ),

                  "updated": repo.get(
                      "updated_at",
                      ""
                  ),

                  "pushed": repo.get(
                      "pushed_at",
                      ""
                  ),

                  "featured": featured,

                  "order": order

              }


              projects.append(project)


          # -----------------------------------------
          # Sort projects
          #
          # Lower order number appears first.
          # -----------------------------------------

          projects.sort(
          key=lambda p: p.get("updated", ""),
          reverse=True
          )


          # -----------------------------------------
          # Write projects.json
          # -----------------------------------------

          with open(
              "projects.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "projects": projects
                  },
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print(
              f"Generated {len(projects)} portfolio projects."
          )

          PY


      - name: Commit updated projects
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add projects.json

          git diff --cached --quiet || \
            git commit \
            -m "Update portfolio projects"

          git push
